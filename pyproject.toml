[project]
name = "the-tell"
version = "0.1.0"
description = "Can you tell from inside a language model that it is about to get it wrong?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pydantic>=2.9",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/the_tell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
